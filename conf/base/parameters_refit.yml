# Parameters for the 'refit' pipeline.
#
# Documentation for this file format can be found in "Parameters"
# Link: https://docs.kedro.org/en/1.5.0/configuration/parameters.html

# No refit, todas as linhas do dataset de modelagem viram 'train': depois de
# validar a abordagem no modelling, reutilizamos TODO o dado para treinar os
# artefatos de produção (imputer, limites de outliers, encoder, scaler e o
# classificador final).
refit_split_name: "train"

modelling_production:
  class_path: "sklearn.ensemble.RandomForestClassifier"
  target_column: 'Outcome'
  train_splits:
    - 'train'
  eval_splits:
    - 'train'
  init_args:
    random_state: 46
  param_grid:
    n_estimators: [100, 200, 300]
    max_depth: [null, 5, 10]
    min_samples_split: [2, 5, 10]
  cv: 5
  scoring: "roc_auc"
  n_jobs: -1
